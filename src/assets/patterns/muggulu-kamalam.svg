<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="muggulu-kamalam" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Traditional Kamalam (lotus) muggulu -->
      <g transform="translate(50, 50)">
        <!-- Center dot grid 5x5 -->
        <circle cx="0" cy="0" r="2.5" fill="#8B0000" opacity="0.6"/>

        <!-- Inner dots -->
        <circle cx="-8" cy="0" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="8" cy="0" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="0" cy="-8" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="0" cy="8" r="1.5" fill="#8B0000" opacity="0.5"/>

        <!-- Middle ring -->
        <circle cx="-16" cy="0" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="16" cy="0" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="0" cy="-16" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="0" cy="16" r="1.5" fill="#DAA520" opacity="0.5"/>

        <circle cx="-11" cy="-11" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="11" cy="-11" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="-11" cy="11" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="11" cy="11" r="1.5" fill="#DAA520" opacity="0.5"/>

        <!-- Lotus petals with continuous curves -->
        <!-- North petal -->
        <path d="M -3,-8 Q -6,-14 -8,-20 Q -4,-24 0,-26 Q 4,-24 8,-20 Q 6,-14 3,-8 Q 0,-10 -3,-8 Z"
              fill="rgba(218, 165, 32, 0.25)"
              stroke="#DAA520"
              stroke-width="1.8"
              opacity="0.45"/>

        <!-- Northeast petal -->
        <path d="M 6,-6 Q 10,-10 15,-15 Q 18,-13 20,-10 Q 18,-6 15,-3 Q 10,-5 6,-6 Z"
              fill="rgba(218, 165, 32, 0.25)"
              stroke="#DAA520"
              stroke-width="1.8"
              opacity="0.45"/>

        <!-- East petal -->
        <path d="M 8,-3 Q 14,-6 20,-8 Q 24,-4 26,0 Q 24,4 20,8 Q 14,6 8,3 Q 10,0 8,-3 Z"
              fill="rgba(218, 165, 32, 0.25)"
              stroke="#DAA520"
              stroke-width="1.8"
              opacity="0.45"/>

        <!-- Southeast petal -->
        <path d="M 6,6 Q 10,10 15,15 Q 13,18 10,20 Q 6,18 3,15 Q 5,10 6,6 Z"
              fill="rgba(218, 165, 32, 0.25)"
              stroke="#DAA520"
              stroke-width="1.8"
              opacity="0.45"/>

        <!-- South petal -->
        <path d="M 3,8 Q 6,14 8,20 Q 4,24 0,26 Q -4,24 -8,20 Q -6,14 -3,8 Q 0,10 3,8 Z"
              fill="rgba(218, 165, 32, 0.25)"
              stroke="#DAA520"
              stroke-width="1.8"
              opacity="0.45"/>

        <!-- Southwest petal -->
        <path d="M -6,6 Q -10,10 -15,15 Q -18,13 -20,10 Q -18,6 -15,3 Q -10,5 -6,6 Z"
              fill="rgba(218, 165, 32, 0.25)"
              stroke="#DAA520"
              stroke-width="1.8"
              opacity="0.45"/>

        <!-- West petal -->
        <path d="M -8,3 Q -14,6 -20,8 Q -24,4 -26,0 Q -24,-4 -20,-8 Q -14,-6 -8,-3 Q -10,0 -8,3 Z"
              fill="rgba(218, 165, 32, 0.25)"
              stroke="#DAA520"
              stroke-width="1.8"
              opacity="0.45"/>

        <!-- Northwest petal -->
        <path d="M -6,-6 Q -10,-10 -15,-15 Q -13,-18 -10,-20 Q -6,-18 -3,-15 Q -5,-10 -6,-6 Z"
              fill="rgba(218, 165, 32, 0.25)"
              stroke="#DAA520"
              stroke-width="1.8"
              opacity="0.45"/>

        <!-- Inner decorative loops -->
        <circle cx="0" cy="0" r="4"
                stroke="#8B0000"
                stroke-width="1.2"
                fill="none"
                opacity="0.4"/>
      </g>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#muggulu-kamalam)"/>
</svg>
