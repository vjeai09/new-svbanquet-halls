<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Noise filter for paper grain -->
    <filter id="paper-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="2"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- Subtle aging spots -->
    <filter id="aging">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0.3"/>
    </filter>
  </defs>

  <!-- Base parchment color -->
  <rect width="400" height="400" fill="#fdf6e3"/>

  <!-- Paper texture grain -->
  <rect width="400" height="400" filter="url(#paper-noise)" opacity="0.03"/>

  <!-- Subtle aging variations -->
  <rect width="400" height="400" filter="url(#aging)" opacity="0.02" fill="#d4a574"/>

  <!-- Additional organic imperfections -->
  <ellipse cx="50" cy="80" rx="30" ry="25" fill="#e8d7b8" opacity="0.015"/>
  <ellipse cx="320" cy="150" rx="25" ry="30" fill="#e8d7b8" opacity="0.012"/>
  <ellipse cx="180" cy="280" rx="35" ry="28" fill="#e8d7b8" opacity="0.018"/>
  <ellipse cx="360" cy="340" rx="28" ry="32" fill="#e8d7b8" opacity="0.014"/>
</svg>
