<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="kolam-swastik" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Traditional swastik kolam (auspicious symbol) -->
      <g transform="translate(40, 40)">
        <!-- Center square with rounded corners -->
        <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#8B0000" opacity="0.3"/>

        <!-- Four arms with organic curves -->
        <path d="M 0,-4 L 0,-20 L 8,-20 L 8,-12 L 4,-12 L 4,-4 Z"
              fill="#DAA520"
              opacity="0.28"
              stroke="#8B0000"
              stroke-width="1"/>
        <path d="M 4,0 L 20,0 L 20,8 L 12,8 L 12,4 L 4,4 Z"
              fill="#DAA520"
              opacity="0.28"
              stroke="#8B0000"
              stroke-width="1"/>
        <path d="M 0,4 L 0,20 L -8,20 L -8,12 L -4,12 L -4,4 Z"
              fill="#DAA520"
              opacity="0.28"
              stroke="#8B0000"
              stroke-width="1"/>
        <path d="M -4,0 L -20,0 L -20,-8 L -12,-8 L -12,-4 L -4,-4 Z"
              fill="#DAA520"
              opacity="0.28"
              stroke="#8B0000"
              stroke-width="1"/>

        <!-- Decorative dots at corners -->
        <circle cx="12" cy="-12" r="2" fill="#8B0000" opacity="0.35"/>
        <circle cx="12" cy="12" r="2" fill="#8B0000" opacity="0.35"/>
        <circle cx="-12" cy="12" r="2" fill="#8B0000" opacity="0.35"/>
        <circle cx="-12" cy="-12" r="2" fill="#8B0000" opacity="0.35"/>
      </g>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#kolam-swastik)"/>
</svg>
