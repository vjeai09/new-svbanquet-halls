<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="muggulu-flower" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Traditional flower muggulu with dot grid -->
      <g transform="translate(40, 40)">
        <!-- Center dot cluster -->
        <circle cx="0" cy="0" r="2.5" fill="#8B0000" opacity="0.6"/>

        <!-- Inner ring of dots -->
        <circle cx="0" cy="-10" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="10" cy="0" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="0" cy="10" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="-10" cy="0" r="1.5" fill="#8B0000" opacity="0.5"/>

        <!-- Diagonal dots -->
        <circle cx="7" cy="-7" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="7" cy="7" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="-7" cy="7" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="-7" cy="-7" r="1.5" fill="#8B0000" opacity="0.5"/>

        <!-- Outer ring dots -->
        <circle cx="0" cy="-18" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="18" cy="0" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="0" cy="18" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="-18" cy="0" r="1.5" fill="#DAA520" opacity="0.5"/>

        <!-- Petal curves - continuous lines -->
        <!-- Top petal -->
        <path d="M 0,-3 Q -5,-8 -7,-13 Q -3,-16 0,-18 Q 3,-16 7,-13 Q 5,-8 0,-3 Z"
              fill="rgba(218, 165, 32, 0.2)"
              stroke="#DAA520"
              stroke-width="1.5"
              opacity="0.4"/>
        <!-- Right petal -->
        <path d="M 3,0 Q 8,-5 13,-7 Q 16,-3 18,0 Q 16,3 13,7 Q 8,5 3,0 Z"
              fill="rgba(218, 165, 32, 0.2)"
              stroke="#DAA520"
              stroke-width="1.5"
              opacity="0.4"/>
        <!-- Bottom petal -->
        <path d="M 0,3 Q 5,8 7,13 Q 3,16 0,18 Q -3,16 -7,13 Q -5,8 0,3 Z"
              fill="rgba(218, 165, 32, 0.2)"
              stroke="#DAA520"
              stroke-width="1.5"
              opacity="0.4"/>
        <!-- Left petal -->
        <path d="M -3,0 Q -8,5 -13,7 Q -16,3 -18,0 Q -16,-3 -13,-7 Q -8,-5 -3,0 Z"
              fill="rgba(218, 165, 32, 0.2)"
              stroke="#DAA520"
              stroke-width="1.5"
              opacity="0.4"/>

        <!-- Connecting loops between petals -->
        <path d="M 5,-5 Q 8,-8 10,-5 Q 8,-3 5,-5"
              stroke="#8B0000"
              stroke-width="1"
              fill="none"
              opacity="0.35"/>
        <path d="M 5,5 Q 8,8 10,5 Q 8,3 5,5"
              stroke="#8B0000"
              stroke-width="1"
              fill="none"
              opacity="0.35"/>
        <path d="M -5,5 Q -8,8 -10,5 Q -8,3 -5,5"
              stroke="#8B0000"
              stroke-width="1"
              fill="none"
              opacity="0.35"/>
        <path d="M -5,-5 Q -8,-8 -10,-5 Q -8,-3 -5,-5"
              stroke="#8B0000"
              stroke-width="1"
              fill="none"
              opacity="0.35"/>
      </g>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#muggulu-flower)"/>
</svg>
