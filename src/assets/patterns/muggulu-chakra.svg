<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="muggulu-chakra" x="0" y="0" width="90" height="90" patternUnits="userSpaceOnUse">
      <!-- Traditional Chakra/wheel muggulu -->
      <g transform="translate(45, 45)">
        <!-- Center hub -->
        <circle cx="0" cy="0" r="3" fill="#8B0000" opacity="0.6"/>

        <!-- Inner circle dots -->
        <circle cx="0" cy="-8" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="8" cy="0" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="0" cy="8" r="1.5" fill="#8B0000" opacity="0.5"/>
        <circle cx="-8" cy="0" r="1.5" fill="#8B0000" opacity="0.5"/>

        <!-- Outer ring dots -->
        <circle cx="0" cy="-20" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="14" cy="-14" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="20" cy="0" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="14" cy="14" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="0" cy="20" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="-14" cy="14" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="-20" cy="0" r="1.5" fill="#DAA520" opacity="0.5"/>
        <circle cx="-14" cy="-14" r="1.5" fill="#DAA520" opacity="0.5"/>

        <!-- Spokes weaving pattern -->
        <!-- Vertical spoke -->
        <path d="M 0,-3 Q -2,-10 -3,-17 M 0,-3 Q 2,-10 3,-17"
              stroke="#DAA520"
              stroke-width="1.5"
              fill="none"
              opacity="0.4"/>
        <path d="M 0,3 Q -2,10 -3,17 M 0,3 Q 2,10 3,17"
              stroke="#DAA520"
              stroke-width="1.5"
              fill="none"
              opacity="0.4"/>

        <!-- Horizontal spoke -->
        <path d="M 3,0 Q 10,-2 17,-3 M 3,0 Q 10,2 17,3"
              stroke="#DAA520"
              stroke-width="1.5"
              fill="none"
              opacity="0.4"/>
        <path d="M -3,0 Q -10,-2 -17,-3 M -3,0 Q -10,2 -17,3"
              stroke="#DAA520"
              stroke-width="1.5"
              fill="none"
              opacity="0.4"/>

        <!-- Diagonal spokes -->
        <path d="M 2,-2 Q 8,-8 12,-12"
              stroke="#DAA520"
              stroke-width="1.5"
              fill="none"
              opacity="0.4"/>
        <path d="M 2,2 Q 8,8 12,12"
              stroke="#DAA520"
              stroke-width="1.5"
              fill="none"
              opacity="0.4"/>
        <path d="M -2,2 Q -8,8 -12,12"
              stroke="#DAA520"
              stroke-width="1.5"
              fill="none"
              opacity="0.4"/>
        <path d="M -2,-2 Q -8,-8 -12,-12"
              stroke="#DAA520"
              stroke-width="1.5"
              fill="none"
              opacity="0.4"/>

        <!-- Circular rim -->
        <circle cx="0" cy="0" r="10"
                stroke="#8B0000"
                stroke-width="1.2"
                fill="none"
                opacity="0.35"/>
        <circle cx="0" cy="0" r="18"
                stroke="#8B0000"
                stroke-width="1.5"
                fill="none"
                opacity="0.4"
                stroke-dasharray="3,2"/>

        <!-- Decorative loops at outer points -->
        <path d="M 0,-21 Q -3,-24 0,-26 Q 3,-24 0,-21"
              stroke="#8B0000"
              stroke-width="1"
              fill="rgba(139, 0, 0, 0.15)"
              opacity="0.4"/>
        <path d="M 21,0 Q 24,-3 26,0 Q 24,3 21,0"
              stroke="#8B0000"
              stroke-width="1"
              fill="rgba(139, 0, 0, 0.15)"
              opacity="0.4"/>
        <path d="M 0,21 Q 3,24 0,26 Q -3,24 0,21"
              stroke="#8B0000"
              stroke-width="1"
              fill="rgba(139, 0, 0, 0.15)"
              opacity="0.4"/>
        <path d="M -21,0 Q -24,3 -26,0 Q -24,-3 -21,0"
              stroke="#8B0000"
              stroke-width="1"
              fill="rgba(139, 0, 0, 0.15)"
              opacity="0.4"/>
      </g>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#muggulu-chakra)"/>
</svg>
