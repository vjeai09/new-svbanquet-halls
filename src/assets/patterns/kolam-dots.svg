<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="kolam-dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Traditional dot-grid kolam pattern -->
      <circle cx="0" cy="0" r="2" fill="#DAA520" opacity="0.4"/>
      <circle cx="20" cy="0" r="2" fill="#DAA520" opacity="0.4"/>
      <circle cx="40" cy="0" r="2" fill="#DAA520" opacity="0.4"/>
      <circle cx="0" cy="20" r="2" fill="#DAA520" opacity="0.4"/>
      <circle cx="20" cy="20" r="2" fill="#DAA520" opacity="0.4"/>
      <circle cx="40" cy="20" r="2" fill="#DAA520" opacity="0.4"/>
      <circle cx="0" cy="40" r="2" fill="#DAA520" opacity="0.4"/>
      <circle cx="20" cy="40" r="2" fill="#DAA520" opacity="0.4"/>
      <circle cx="40" cy="40" r="2" fill="#DAA520" opacity="0.4"/>

      <!-- Connecting curves - organic imperfect lines -->
      <path d="M 10,10 Q 15,15 20,10 T 30,10"
            stroke="#8B0000"
            stroke-width="1.5"
            fill="none"
            opacity="0.25"
            stroke-linecap="round"/>
      <path d="M 10,30 Q 15,25 20,30 T 30,30"
            stroke="#8B0000"
            stroke-width="1.5"
            fill="none"
            opacity="0.25"
            stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#kolam-dots)"/>
</svg>
