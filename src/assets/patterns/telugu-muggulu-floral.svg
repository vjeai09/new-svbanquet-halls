<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="telugu-muggulu-floral" x="0" y="0" width="70" height="70" patternUnits="userSpaceOnUse">
      <!-- Authentic Telugu floral muggulu with 5x5 dot grid -->
      <g transform="translate(35, 35)">
        <!-- Dot grid (5x5 pulli pattern) -->
        <circle cx="-16" cy="-16" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="-8" cy="-16" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="0" cy="-16" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="8" cy="-16" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="16" cy="-16" r="1.2" fill="#8B0000" opacity="0.45"/>

        <circle cx="-16" cy="-8" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="-8" cy="-8" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="0" cy="-8" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="8" cy="-8" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="16" cy="-8" r="1.2" fill="#8B0000" opacity="0.45"/>

        <circle cx="-16" cy="0" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="-8" cy="0" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="0" cy="0" r="2" fill="#8B0000" opacity="0.55"/>
        <circle cx="8" cy="0" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="16" cy="0" r="1.2" fill="#8B0000" opacity="0.45"/>

        <circle cx="-16" cy="8" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="-8" cy="8" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="0" cy="8" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="8" cy="8" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="16" cy="8" r="1.2" fill="#8B0000" opacity="0.45"/>

        <circle cx="-16" cy="16" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="-8" cy="16" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="0" cy="16" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="8" cy="16" r="1.2" fill="#8B0000" opacity="0.45"/>
        <circle cx="16" cy="16" r="1.2" fill="#8B0000" opacity="0.45"/>

        <!-- Floral petals weaving around dots - continuous curves -->
        <!-- Top petal -->
        <path d="M -3,-8 Q -6,-12 -8,-16 Q -4,-18 0,-19 Q 4,-18 8,-16 Q 6,-12 3,-8 Q 0,-9 -3,-8"
              fill="rgba(218, 165, 32, 0.18)"
              stroke="#DAA520"
              stroke-width="1.3"
              opacity="0.45"/>

        <!-- Right petal -->
        <path d="M 8,-3 Q 12,-6 16,-8 Q 18,-4 19,0 Q 18,4 16,8 Q 12,6 8,3 Q 9,0 8,-3"
              fill="rgba(218, 165, 32, 0.18)"
              stroke="#DAA520"
              stroke-width="1.3"
              opacity="0.45"/>

        <!-- Bottom petal -->
        <path d="M 3,8 Q 6,12 8,16 Q 4,18 0,19 Q -4,18 -8,16 Q -6,12 -3,8 Q 0,9 3,8"
              fill="rgba(218, 165, 32, 0.18)"
              stroke="#DAA520"
              stroke-width="1.3"
              opacity="0.45"/>

        <!-- Left petal -->
        <path d="M -8,3 Q -12,6 -16,8 Q -18,4 -19,0 Q -18,-4 -16,-8 Q -12,-6 -8,-3 Q -9,0 -8,3"
              fill="rgba(218, 165, 32, 0.18)"
              stroke="#DAA520"
              stroke-width="1.3"
              opacity="0.45"/>

        <!-- Inner decorative curves looping dots -->
        <path d="M -6,-2 Q -8,-4 -8,-6 Q -6,-6 -4,-4 Q -2,-6 0,-6 Q 2,-6 4,-4 Q 6,-6 8,-6 Q 8,-4 6,-2"
              stroke="#8B0000"
              stroke-width="1.1"
              fill="none"
              opacity="0.38"/>

        <path d="M 6,2 Q 8,4 8,6 Q 6,6 4,4 Q 2,6 0,6 Q -2,6 -4,4 Q -6,6 -8,6 Q -8,4 -6,2"
              stroke="#8B0000"
              stroke-width="1.1"
              fill="none"
              opacity="0.38"/>

        <!-- Center flower detail -->
        <circle cx="0" cy="0" r="5"
                stroke="#8B0000"
                stroke-width="1"
                fill="none"
                opacity="0.35"/>

        <!-- Small decorative loops at corners -->
        <path d="M -10,-10 Q -12,-12 -10,-14 Q -8,-12 -10,-10"
              fill="rgba(139, 0, 0, 0.15)"
              stroke="#8B0000"
              stroke-width="0.8"
              opacity="0.4"/>
        <path d="M 10,-10 Q 12,-12 10,-14 Q 8,-12 10,-10"
              fill="rgba(139, 0, 0, 0.15)"
              stroke="#8B0000"
              stroke-width="0.8"
              opacity="0.4"/>
        <path d="M 10,10 Q 12,12 10,14 Q 8,12 10,10"
              fill="rgba(139, 0, 0, 0.15)"
              stroke="#8B0000"
              stroke-width="0.8"
              opacity="0.4"/>
        <path d="M -10,10 Q -12,12 -10,14 Q -8,12 -10,10"
              fill="rgba(139, 0, 0, 0.15)"
              stroke="#8B0000"
              stroke-width="0.8"
              opacity="0.4"/>
      </g>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#telugu-muggulu-floral)"/>
</svg>
